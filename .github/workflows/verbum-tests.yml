name: Verbum tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install tomli
        if: matrix.python == '3.9'
      - run: python -m unittest discover -s tests -p "test_verbum*.py"
  gtk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth
      - run: VERBUM_GTK_TEST=1 xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p test_verbum_gtk.py -v
